<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pantin – Grand écart</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: white;
      font-family: sans-serif;
    }

    #startOverlay button {
      font-size: 1.5rem;
      padding: 1rem 2rem;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="startOverlay">
  <button id="startBtn">Démarrer l’expérience</button>
</div>

<a-scene 
  box-spread=""
  fog="type: exponential; color: #cfd4da; density: 0.04"
  keyboard-shortcuts=""
  screenshot=""
  xr-mode-ui=""
  device-orientation-permission-ui="">

  <!-- VIDEO -->
  <a-video id="video"
           src="./Epic-BTS3.mp4"
           position="0 2.54 -0.37"
           scale="5 5 5"
           autoplay="false"
           loop="true"
           muted="true"
           playsinline="true">
  </a-video>

  <a-entity rotation="0 180 0">

    <!-- LUMIÈRES -->
    <a-entity id="ambientLight"
              light="color: #FFFFFF; intensity: 0.6; type: ambient">
    </a-entity>

    <a-entity id="mainLight"
              light="color: #FFFFFF; intensity: 0.9"
              position="1 3 2">
    </a-entity>

    <!-- CAISSES -->
    <a-entity id="boxL">
      <a-gltf-model src="./scene.glb" scale="0.61647 0.59806 1"></a-gltf-model>
      <a-box position="0 0.25 0" width="0.6" height="0.5" depth="0.6" visible="false"></a-box>
      <a-box id="footL" position="0 0.55 0" width="0.3" height="0.1" depth="0.4" visible="false"></a-box>
    </a-entity>

    <a-entity id="boxR">
      <a-gltf-model src="./scene.glb" scale="0.59847 0.60631 1"></a-gltf-model>
      <a-box position="0 0.25 0" width="0.6" height="0.5" depth="0.6" visible="false"></a-box>
      <a-box id="footR" position="0 0.55 0" width="0.3" height="0.1" depth="0.4" visible="false"></a-box>
    </a-entity>

    <!-- PANTIN -->
    <a-entity id="pantin" pantin="">
      <a-entity id="pelvis"></a-entity>

      <a-cylinder id="legL" radius="0.08" material="color: #012730"></a-cylinder>
      <a-cylinder id="legR" radius="0.08" material="color: #000000"></a-cylinder>

      <a-cylinder id="trunk"
                  radius="0.12"
                  height="0.4"
                  material="color: #000000">
      </a-cylinder>
    </a-entity>

  </a-entity>

  <!-- ÎLES -->
  <a-curvedimage src="Flyer.jpg"
                 geometry="radius: 4; segmentsHeight: 10; thetaLength: 90"
                 position="0 3 4.3"
                 scale="1 10 1">
  </a-curvedimage>

  <a-curvedimage src="Flyer2.jpg"
                 geometry="radius: 4; segmentsHeight: 10; thetaLength: 90"
                 rotation="0 -90 0"
                 position="0 3 4.3"
                 scale="1 10 1">
  </a-curvedimage>

  <!-- BOUTON -->
  <a-entity id="epicButton"
            geometry="primitive: box; width: 1.05; height: 0.35; depth: 0.18"
            material="color: #E10600"
            position="0 1.2 3"
            class="clickable">

    <a-text value="EPIC SPLIT"
            align="center"
            color="white"
            position="0 0 0.1"
            width="1.8">
    </a-text>
  </a-entity>

  <a-sky src="./paf-pan.jpg"></a-sky>

  <a-camera position="0 1.8 4.3"
            rotation="48 -15 0">
    <a-cursor raycaster="objects: .clickable"></a-cursor>
  </a-camera>

</a-scene>

<!-- TON SCRIPT RESTE EXACTEMENT IDENTIQUE -->
<script>
/* (je ne le modifie pas, il reste comme tu l’as envoyé) */
</script>

</body>
</html>
